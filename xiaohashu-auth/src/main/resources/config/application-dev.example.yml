spring:
  data:
    redis:
      database: 0    #數據庫索引
      host: localhost  #redis服務器地址
      port: 6379  # 端口號
      password: "REPLACE_WITH_LOCAL_VALUE"
      timeout: 5s # 读超时时间
      connect-timeout: 5s # 链接超时时间
      lettuce:
        pool:
          max-active: 200 # 连接池最大连接数
          max-wait: -1ms # 连接池最大阻塞等待时间（使用负值表示没有限制）
          min-idle: 0 # 连接池中的最小空闲连接
          max-idle: 10 # 连接池中的最大空闲连接

aliyun: # 接入阿里云（发送短信使用）
  accessKeyId: "REPLACE_WITH_LOCAL_VALUE"
  accessKeySecret: "REPLACE_WITH_LOCAL_VALUE"



