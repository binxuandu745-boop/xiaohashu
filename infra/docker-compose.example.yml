name: xiaohashu-local

services:
  mysql:
    image: mysql:8.0.27
    container_name: xiaohashu-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --expire-logs-days=7
      - --lower-case-table-names=1
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 768m
    networks: [xiaohashu]

  redis:
    image: redis:7.2.3
    container_name: xiaohashu-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - sh
      - -c
      - exec redis-server /etc/redis/redis.conf --bind 0.0.0.0 --dir /data --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - type: bind
        source: C:/redis/data
        target: /data
      - type: bind
        source: C:/redis/conf/redis.conf.xml
        target: /etc/redis/redis.conf
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 256m
    networks: [xiaohashu]

  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: xiaohashu-nacos
    restart: unless-stopped
    ports:
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
    mem_limit: 640m
    networks: [xiaohashu]

  minio:
    image: minio/minio:RELEASE.2023-09-30T07-02-29Z
    container_name: xiaohashu-minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9090:9090"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    command: server /data --console-address ":9090"
    volumes:
      - type: bind
        source: C:/docker/minio/data
        target: /data
    mem_limit: 512m
    networks: [xiaohashu]

  cassandra:
    image: cassandra:latest
    container_name: xiaohashu-cassandra
    restart: unless-stopped
    ports:
      - "127.0.0.1:9042:9042"
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
      CASSANDRA_CLUSTER_NAME: Test Cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    volumes:
      - type: bind
        source: C:/docker/cassandra/data
        target: /var/lib/cassandra
    mem_limit: 1280m
    networks: [xiaohashu]

  zookeeper:
    image: zookeeper:3.5.6
    container_name: xiaohashu-zookeeper
    restart: unless-stopped
    ports:
      - "127.0.0.1:2181:2181"
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: ruok,mntr,stat
    volumes:
      - type: bind
        source: C:/docker/zookeeper/data
        target: /data
      - zookeeper-datalog:/datalog
    mem_limit: 320m
    networks: [xiaohashu]

  rocketmq-namesrv:
    image: apache/rocketmq:4.9.4
    container_name: xiaohashu-rocketmq-namesrv
    restart: unless-stopped
    ports:
      - "127.0.0.1:9876:9876"
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: -Xms128m -Xmx256m -Xmn64m
    volumes:
      - rocketmq-namesrv-logs:/home/rocketmq/logs
    mem_limit: 384m
    networks: [xiaohashu]

  rocketmq-broker:
    image: apache/rocketmq:4.9.4
    container_name: xiaohashu-rocketmq-broker
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
    ports:
      - "192.168.134.1:10909:10909"
      - "192.168.134.1:10911:10911"
      - "192.168.134.1:10912:10912"
    command: sh mqbroker -c /home/rocketmq/rocketmq-4.9.4/conf/broker.conf
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: -Xms256m -Xmx512m -Xmn128m
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/rocketmq-4.9.4/conf/broker.conf:ro
      - rocketmq-broker-logs:/home/rocketmq/logs
      - rocketmq-broker-store:/home/rocketmq/store
    mem_limit: 768m
    networks: [xiaohashu]

  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: xiaohashu-rocketmq-dashboard
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
      - rocketmq-broker
    ports:
      - "127.0.0.1:8180:8082"
    environment:
      JAVA_OPTS: -Xms128m -Xmx256m -Drocketmq.namesrv.addr=rocketmq-namesrv:9876 -Dcom.rocketmq.sendMessageWithVIPChannel=false
    mem_limit: 384m
    networks: [xiaohashu]

  elasticsearch:
    build:
      context: ./elasticsearch
    image: xiaohashu/elasticsearch-ik:7.3.0
    container_name: xiaohashu-elasticsearch
    restart: unless-stopped
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9300:9300"
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    mem_limit: 1024m
    networks: [xiaohashu]

  elasticsearch-head:
    image: mobz/elasticsearch-head:5
    container_name: xiaohashu-elasticsearch-head
    restart: unless-stopped
    depends_on:
      - elasticsearch
    ports:
      - "127.0.0.1:9100:9100"
    mem_limit: 192m
    networks: [xiaohashu]

  kibana:
    image: docker.elastic.co/kibana/kibana:7.3.0
    container_name: xiaohashu-kibana
    restart: unless-stopped
    depends_on:
      - elasticsearch
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SERVER_NAME: xiaohashu-kibana
    mem_limit: 512m
    networks: [xiaohashu]

  canal:
    image: canal/canal-server:v1.1.7
    container_name: xiaohashu-canal
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:11111:11111"
    environment:
      canal.auto.scan: "false"
      canal.destinations: example
      canal.instance.master.address: mysql:3306
      canal.instance.dbUsername: canal
      canal.instance.dbPassword: ${CANAL_DB_PASSWORD:?CANAL_DB_PASSWORD is required}
      canal.instance.connectionCharset: UTF-8
      canal.instance.tsdb.enable: "false"
      canal.instance.gtidon: "false"
      canal.instance.filter.regex: xiaohashu\\.t_note,xiaohashu\\.t_user
    mem_limit: 640m
    networks: [xiaohashu]

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.1
    container_name: xiaohashu-xxl-job-admin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:7777:7777"
    environment:
      JAVA_OPTS: -Xms128m -Xmx384m
      PARAMS: >-
        --server.port=7777
        --server.servlet.context-path=/xxl-job-admin
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=false&serverTimezone=Asia/Shanghai
        --spring.datasource.username=root
        --spring.datasource.password=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
        --xxl.job.accessToken=${XXL_JOB_ACCESS_TOKEN:?XXL_JOB_ACCESS_TOKEN is required}
    mem_limit: 512m
    networks: [xiaohashu]

  sentinel-dashboard:
    build:
      context: ./sentinel
    image: xiaohashu/sentinel-dashboard:1.8.6
    container_name: xiaohashu-sentinel-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:8060:8060"
    mem_limit: 384m
    networks: [xiaohashu]

networks:
  xiaohashu:
    name: xiaohashu-local

volumes:
  mysql-data:
  zookeeper-datalog:
  rocketmq-namesrv-logs:
  rocketmq-broker-logs:
  rocketmq-broker-store:
  elasticsearch-data:
